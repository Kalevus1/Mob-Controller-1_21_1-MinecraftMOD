plugins {
	id 'net.minecraftforge.gradle' version "${forgegradle_version}"
}

base { archivesName = "${archives_base_name}-forge" }

// Compila la lógica común (java + recursos).
sourceSets.main.java.srcDir "${rootDir}/common/src/main/java"
sourceSets.main.resources.srcDir "${rootDir}/common/src/main/resources"

minecraft {
	mappings channel: 'official', version: project.minecraft_version
	// Forge 1.21.1 usa mappings oficiales en runtime: no hace falta reobfuscar.
	reobf = false
}

dependencies {
	minecraft "net.minecraftforge:forge:${forge_version}"
}

// La versión se inyecta en mods.toml vía ${file.jarVersion} (manifiesto del jar).
tasks.named('jar') {
	manifest {
		attributes([
			'Implementation-Version': project.version
		])
	}
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(21)
}
